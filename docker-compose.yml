version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: pickleball-db
    environment:
      POSTGRES_DB: pickleball
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

