<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Doanh thu</title>
    <link rel="stylesheet" href="/assets/css/main.css">
    <link rel="stylesheet" href="revenue.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>
    <div class="admin-layout">
        <!-- Sidebar (Loaded dynamically via /assets/js/admin-sidebar.js) -->
        <aside class="admin-sidebar"></aside>

        <main class="admin-content">
            <div class="admin-header">
                <h1>Báo cáo Doanh thu</h1>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value" id="total-revenue">0</div>
                    <div class="stat-label">Tổng doanh thu</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="completed-bookings">0</div>
                    <div class="stat-label">Đơn hoàn thành</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="confirmed-bookings">0</div>
                    <div class="stat-label">Đơn đã xác nhận</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="cancelled-bookings">0</div>
                    <div class="stat-label">Đơn đã hủy</div>
                </div>
            </div>

            <div class="card">
                <h2 class="mb-2">Doanh thu theo sân</h2>
                <table class="table">
                    <thead>
                        <tr>
                            <th>Sân</th>
                            <th>Số đơn</th>
                            <th>Doanh thu</th>
                        </tr>
                    </thead>
                    <tbody id="revenue-by-court"></tbody>
                </table>
            </div>

            <div class="card">
                <h2 class="mb-2">Doanh thu theo tháng</h2>
                <table class="table">
                    <thead>
                        <tr>
                            <th>Tháng</th>
                            <th>Doanh thu</th>
                        </tr>
                    </thead>
                    <tbody id="revenue-by-month"></tbody>
                </table>
            </div>
        </main>
    </div>

    <script src="/assets/js/common.js"></script>
    <script src="/assets/js/admin-sidebar.js"></script>
    <script src="revenue.js"></script>
</body>

</html>
