<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Dịch vụ đi kèm</title>
    <link rel="stylesheet" href="/assets/css/main.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>
    <div class="admin-layout">
        <!-- Sidebar (Loaded dynamically via /assets/js/admin-sidebar.js) -->
        <aside class="admin-sidebar"></aside>

        <main class="admin-content">
            <div class="admin-header">
                <h1>Dịch vụ đi kèm</h1>
                <button class="btn btn-primary" onclick="openEquipmentModal()">+ Thêm dịch vụ</button>
            </div>

            <div class="card">
                <p class="text-muted text-sm mb-2">
                    Quản lý các dịch vụ khách có thể chọn khi đặt sân như thuê vợt, bóng, khăn, nước uống.
                </p>
                <table class="table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Tên dịch vụ</th>
                            <th>Mô tả</th>
                            <th>Giá/lượt</th>
                            <th>Số lượng</th>
                            <th>Trạng thái</th>
                            <th>Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="equipment-list">
                        <tr><td colspan="7" class="text-center">Đang tải...</td></tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <div class="modal-overlay" id="equipment-modal">
        <div class="modal" style="max-width: 620px;">
            <div class="modal-header">
                <h3 class="modal-title" id="equipment-modal-title">Thêm dịch vụ</h3>
                <button class="modal-close" onclick="hideModal('equipment-modal')">&times;</button>
            </div>
            <div class="modal-body">
                <form id="equipment-form">
                    <input type="hidden" id="equipment-id">

                    <div class="form-group">
                        <label class="form-label" for="equipment-name">Tên dịch vụ *</label>
                        <input type="text" id="equipment-name" class="form-control" maxlength="255" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="equipment-description">Mô tả</label>
                        <textarea id="equipment-description" class="form-control" rows="3"></textarea>
                    </div>

                    <div class="grid" style="grid-template-columns:1fr 1fr; gap:1rem;">
                        <div class="form-group">
                            <label class="form-label" for="equipment-price">Giá/lượt (VNĐ) *</label>
                            <input type="number" id="equipment-price" class="form-control" min="0" step="1000" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="equipment-quantity">Số lượng khả dụng *</label>
                            <input type="number" id="equipment-quantity" class="form-control" min="0" step="1" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="equipment-active">Trạng thái</label>
                        <select id="equipment-active" class="form-control">
                            <option value="true">Đang phục vụ</option>
                            <option value="false">Tạm ngưng</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="hideModal('equipment-modal')">Hủy</button>
                <button class="btn btn-primary" id="save-equipment-btn">Lưu</button>
            </div>
        </div>
    </div>

    <script src="/assets/js/common.js"></script>
    <script src="/assets/js/admin-sidebar.js"></script>
    <script src="equipment.js"></script>
</body>

</html>
