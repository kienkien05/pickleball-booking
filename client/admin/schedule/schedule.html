<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Thời khóa biểu</title>
    <link rel="stylesheet" href="/assets/css/main.css">
    <link rel="stylesheet" href="schedule.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        /* Tùy chỉnh nhanh cho Timetable */
        .schedule-controls {
            display: flex;
            gap: 1.5rem;
            align-items: flex-end;
            margin-bottom: 2rem;
            background: white;
            padding: 1.5rem;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        .timetable-container {
            background: white;
            padding: 1rem;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow-x: auto;
        }

        .timetable {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            min-width: 1000px;
        }

        .timetable th, .timetable td {
            border: 1px solid #eee;
            padding: 0;
            height: 100px;
            width: 13%;
            vertical-align: top;
            position: relative;
        }

        .timetable th {
            height: auto;
            padding: 1rem 0.5rem;
            background: var(--background-alt);
            text-align: center;
            font-weight: 600;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .timetable th .date-label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: normal;
            margin-top: 4px;
        }

        .time-col {
            width: 90px !important;
            background: var(--background-alt);
            font-weight: 600;
            text-align: center;
            vertical-align: middle !important;
            font-size: 0.9rem;
        }

        /* Booking Block Styles */
        .booking-item {
            margin: 4px;
            padding: 8px;
            border-radius: 6px;
            font-size: 0.85rem;
            line-height: 1.3;
            cursor: pointer;
            transition: transform 0.2s;
            height: calc(100% - 8px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
        }

        .booking-item:hover {
            transform: scale(1.02);
            z-index: 5;
            box-shadow: var(--shadow-lg);
        }

        /* Khách thường - Light Blue */
        .booking-regular {
            background-color: #E3F2FD;
            border-left: 4px solid #2196F3;
            color: #0D47A1;
        }

        /* Khách VIP - Gold/Orange */
        .booking-vip {
            background-color: #FFF8E1;
            border-left: 4px solid #FFC107;
            color: #7F5F00;
        }

        .booking-name {
            font-weight: bold;
            display: block;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .booking-status {
            font-size: 0.75rem;
            opacity: 0.8;
            margin-top: 4px;
        }

        .booking-auto {
            position: absolute;
            top: 2px;
            right: 4px;
            font-size: 0.7rem;
            background: rgba(0,0,0,0.05);
            padding: 1px 4px;
            border-radius: 4px;
        }

        /* Tooltip custom */
        .booking-item[title]:hover::after {
            content: attr(title);
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            white-space: pre;
            z-index: 100;
            pointer-events: none;
            margin-bottom: 5px;
        }
    </style>
</head>

<body>
    <div class="admin-layout">
        <!-- Sidebar (Loaded dynamically via /assets/js/admin-sidebar.js) -->
        <aside class="admin-sidebar"></aside>

        <!-- Main Content -->
        <main class="admin-content">
            <div class="admin-header">
                <h1>Thời khóa biểu đặt sân</h1>
                <span class="text-muted">Quản lý lịch trình và điều phối sân chơi</span>
            </div>

            <!-- Controls -->
            <div class="schedule-controls">
                <div class="form-group mb-0">
                    <label class="form-label">Chọn tuần</label>
                    <input type="week" id="week-picker" class="form-control" style="width: 250px;">
                </div>
                <div class="form-group mb-0">
                    <label class="form-label">Lọc theo sân</label>
                    <select id="court-filter" class="form-control" style="width: 200px;">
                        <option value="">Tất cả sân</option>
                    </select>
                </div>
                <button id="refresh-btn" class="btn btn-secondary">
                    <i class="bi bi-arrow-clockwise"></i> Làm mới
                </button>
            </div>

            <!-- Timetable Area -->
            <div class="timetable-container" id="schedule-area">
                <table class="timetable">
                    <thead>
                        <tr id="timetable-header">
                            <th class="time-col">Khung giờ</th>
                            <th>Thứ 2<span class="date-label">--</span></th>
                            <th>Thứ 3<span class="date-label">--</span></th>
                            <th>Thứ 4<span class="date-label">--</span></th>
                            <th>Thứ 5<span class="date-label">--</span></th>
                            <th>Thứ 6<span class="date-label">--</span></th>
                            <th>Thứ 7<span class="date-label">--</span></th>
                            <th>Chủ Nhật<span class="date-label">--</span></th>
                        </tr>
                    </thead>
                    <tbody id="timetable-body">
                        <!-- Sẽ được render bằng JS -->
                        <tr>
                            <td colspan="8" class="text-center p-4">Đang tải dữ liệu...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script src="/assets/js/common.js"></script>
    <script src="/assets/js/admin-sidebar.js"></script>
    <script src="schedule.js"></script>
</body>

</html>
