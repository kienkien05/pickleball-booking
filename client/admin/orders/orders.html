<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Quản lý đơn đặt</title>
    <link rel="stylesheet" href="/assets/css/main.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>
    <div class="admin-layout">
        <aside class="admin-sidebar">
            <a href="/" class="admin-sidebar-logo">Pickleball Admin</a>
            <ul class="admin-nav">
                <li><a href="/admin/dashboard/dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
                <li><a href="/admin/revenue/revenue.html"><i class="bi bi-graph-up-arrow"></i> Doanh thu</a></li>
                <li><a href="/admin/orders/orders.html" class="active"><i class="bi bi-clipboard-check"></i> Đơn đặt sân</a></li>
                <li><a href="/admin/customers/customers.html"><i class="bi bi-people"></i> Khách hàng</a></li>
                <li><a href="/admin/courts/courts.html"><i class="bi bi-building"></i> Quản lý sân</a></li>
                <li><a href="/admin/timeslots/timeslots.html"><i class="bi bi-clock"></i> Khung giờ</a></li>
                <li><a href="/admin/equipment/equipment.html"><i class="bi bi-bag-check"></i> Dịch vụ đi kèm</a></li>
                <li><a href="#" class="logout-btn"><i class="bi bi-box-arrow-right"></i> Đăng xuất</a></li>
            </ul>
        </aside>

        <main class="admin-content">
            <div class="admin-header">
                <h1>Quản lý đơn đặt sân</h1>
                <div class="flex gap-2">
                    <select id="status-filter" class="form-control" style="width: auto;">
                        <option value="">Tất cả trạng thái</option>
                        <option value="pending">Chờ xác nhận</option>
                        <option value="confirmed">Đã xác nhận</option>
                        <option value="in_progress">Đang chơi</option>
                        <option value="completed">Hoàn thành</option>
                        <option value="cancelled">Đã hủy</option>
                    </select>
                </div>
            </div>

            <div class="card">
                <table class="table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Khách hàng</th>
                            <th>Sân</th>
                            <th>Ngày</th>
                            <th>Khung giờ</th>
                            <th>Trạng thái</th>
                            <th>Tiền / Hình thức</th>
                            <th>PTTT</th>
                            <th>Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="bookings-list"></tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Action Modal -->
    <div class="modal-overlay" id="action-modal">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title" id="modal-title">Xác nhận</h3>
                <button class="modal-close" onclick="hideModal('action-modal')">&times;</button>
            </div>
            <div class="modal-body">
                <p id="modal-message"></p>
                <div id="reason-group" class="form-group mt-2 hidden">
                    <label class="form-label" id="reason-label">Lý do hủy</label>
                    <textarea id="cancel-reason" class="form-control" rows="3" placeholder="Nhập lý do (không bắt buộc)"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="hideModal('action-modal')">Hủy bỏ</button>
                <button class="btn btn-primary" id="confirm-action-btn">Xác nhận</button>
            </div>
        </div>
    </div>

    <script src="/assets/js/common.js"></script>
    <script src="orders.js"></script>
</body>

</html>
