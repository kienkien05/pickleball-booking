<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Dashboard</title>
    <link rel="stylesheet" href="/assets/css/main.css">
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>
    <div class="admin-layout">
        <!-- Sidebar (Loaded dynamically via /assets/js/admin-sidebar.js) -->
        <aside class="admin-sidebar"></aside>

        <!-- Main Content -->
        <main class="admin-content">
            <div class="admin-header">
                <h1>Dashboard</h1>
                <span class="text-muted">Xin chào, <span id="admin-name">Admin</span></span>
            </div>

            <!-- Stats -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value" id="stat-revenue">0</div>
                    <div class="stat-label">Doanh thu tháng này</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="stat-bookings">0</div>
                    <div class="stat-label">Tổng đơn đặt</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="stat-pending">0</div>
                    <div class="stat-label">Đơn chờ xác nhận</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="stat-customers">0</div>
                    <div class="stat-label">Khách hàng</div>
                </div>
            </div>

            <!-- Recent Bookings -->
            <div class="card">
                <div class="card-header flex-between">
                    <h2 class="card-title mb-0">Đơn đặt gần đây</h2>
                    <a href="/admin/orders/orders.html" class="btn btn-secondary btn-sm">Xem tất cả</a>
                </div>
                <table class="table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Khách hàng</th>
                            <th>Sân</th>
                            <th>Ngày</th>
                            <th>Trạng thái</th>
                            <th>Tổng tiền</th>
                        </tr>
                    </thead>
                    <tbody id="recent-bookings">
                        <tr>
                            <td colspan="6" class="text-center">Đang tải...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script src="/assets/js/common.js"></script>
    <script src="/assets/js/admin-sidebar.js"></script>
    <script src="dashboard.js"></script>
</body>

</html>
