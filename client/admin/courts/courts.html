<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Quản lý sân</title>
    <link rel="stylesheet" href="/assets/css/main.css">
</head>

<body>
    <div class="admin-layout">
        <aside class="admin-sidebar">
            <a href="/" class="admin-sidebar-logo">🏓 Pickleball Admin</a>
            <ul class="admin-nav">
                <li><a href="/admin/dashboard/dashboard.html">📊 Dashboard</a></li>
                <li><a href="/admin/revenue/revenue.html">💰 Doanh thu</a></li>
                <li><a href="/admin/orders/orders.html">📋 Đơn đặt sân</a></li>
                <li><a href="/admin/customers/customers.html">👥 Khách hàng</a></li>
                <li><a href="/admin/courts/courts.html" class="active">🏟️ Quản lý sân</a></li>
                <li><a href="/admin/timeslots/timeslots.html">🕐 Khung giờ</a></li>
                <li><a href="#" class="logout-btn">🚪 Đăng xuất</a></li>
            </ul>
        </aside>

        <main class="admin-content">
            <div class="admin-header">
                <h1>Quản lý sân</h1>
                <button class="btn btn-primary" onclick="openCourtModal()">+ Thêm sân mới</button>
            </div>

            <div class="card">
                <table class="table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Tên sân</th>
                            <th>Địa chỉ</th>
                            <th>Giá/giờ</th>
                            <th>Trạng thái</th>
                            <th>Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="courts-list"></tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Court Modal -->
    <div class="modal-overlay" id="court-modal">
        <div class="modal" style="max-width: 600px;">
            <div class="modal-header">
                <h3 class="modal-title" id="court-modal-title">Thêm sân mới</h3>
                <button class="modal-close" onclick="hideModal('court-modal')">&times;</button>
            </div>
            <div class="modal-body">
                <form id="court-form">
                    <input type="hidden" id="court-id">
                    <div class="form-group">
                        <label class="form-label">Tên sân *</label>
                        <input type="text" id="court-name" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Địa chỉ *</label>
                        <input type="text" id="court-address" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Quận *</label>
                        <select id="court-district" class="form-control" required></select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Giá/giờ (VNĐ) *</label>
                        <input type="number" id="court-price" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Mô tả</label>
                        <textarea id="court-description" class="form-control" rows="3"></textarea>
                    </div>
                    <div class="form-group">
                        <label class="form-label">URL ảnh</label>
                        <input type="text" id="court-image" class="form-control" placeholder="https://...">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="hideModal('court-modal')">Hủy</button>
                <button class="btn btn-primary" id="save-court-btn">Lưu</button>
            </div>
        </div>
    </div>

    <script src="/assets/js/common.js"></script>
    <script src="courts.js"></script>
</body>

</html>
