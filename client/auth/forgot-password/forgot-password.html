<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu - Pickleball</title>
    <link rel="stylesheet" href="/assets/css/main.css">
    <link rel="stylesheet" href="forgot-password.css">
</head>

<body>
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <div class="auth-logo"><span class="brand-mark brand-mark-lg" aria-hidden="true">PB</span></div>
                <h1 class="auth-title">Quên mật khẩu</h1>
                <p class="auth-subtitle">Nhập email để nhận mã xác nhận</p>
            </div>

            <!-- Step 1: Enter Email -->
            <form id="email-form">
                <div class="form-group">
                    <label class="form-label" for="email">Email</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="Nhập email của bạn"
                        required>
                    <div class="form-error"></div>
                </div>

                <button type="submit" class="btn btn-primary btn-block" id="email-submit-btn">
                    Gửi mã xác nhận
                </button>
            </form>

            <!-- Step 2: Enter Code and New Password (hidden initially) -->
            <form id="reset-form" class="hidden">
                <div class="alert alert-info mb-2">
                    Mã xác nhận đã được gửi đến email của bạn. Vui lòng kiểm tra hộp thư.
                </div>

                <div class="form-group">
                    <label class="form-label" for="token">Mã xác nhận (6 số)</label>
                    <input type="text" id="token" name="token" class="form-control" placeholder="Nhập mã 6 số"
                        maxlength="6" required>
                    <div class="form-error"></div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="new_password">Mật khẩu mới</label>
                    <input type="password" id="new_password" name="new_password" class="form-control"
                        placeholder="Tối thiểu 6 ký tự" required>
                    <div class="form-error"></div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="confirm_password">Xác nhận mật khẩu mới</label>
                    <input type="password" id="confirm_password" name="confirm_password" class="form-control"
                        placeholder="Nhập lại mật khẩu" required>
                    <div class="form-error"></div>
                </div>

                <button type="submit" class="btn btn-primary btn-block" id="reset-submit-btn">
                    Đổi mật khẩu
                </button>
            </form>

            <!-- Success Message (hidden initially) -->
            <div id="success-message" class="hidden text-center">
                <div class="alert alert-success">
                    Đổi mật khẩu thành công!
                </div>
                <a href="/auth/login/login.html" class="btn btn-primary btn-block mt-2">
                    Đăng nhập ngay
                </a>
            </div>

            <div class="auth-footer">
                <p><a href="/auth/login/login.html">← Quay lại đăng nhập</a></p>
            </div>
        </div>
    </div>

    <script src="/assets/js/common.js"></script>
    <script src="forgot-password.js"></script>
</body>

</html>
