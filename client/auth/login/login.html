<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Pickleball</title>
    <link rel="stylesheet" href="/assets/css/main.css">
    <link rel="stylesheet" href="login.css">
</head>

<body>
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <div class="auth-logo">🏓</div>
                <h1 class="auth-title">Đăng nhập</h1>
                <p class="auth-subtitle">Chào mừng bạn quay lại!</p>
            </div>

            <form id="login-form">
                <div class="form-group">
                    <label class="form-label" for="email">Email hoặc Số điện thoại</label>
                    <input type="text" id="email" name="email" class="form-control" placeholder="Nhập email hoặc SĐT"
                        required>
                    <div class="form-error"></div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Mật khẩu</label>
                    <input type="password" id="password" name="password" class="form-control"
                        placeholder="Nhập mật khẩu" required>
                    <div class="form-error"></div>
                </div>

                <div class="flex-between mb-2">
                    <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                        <input type="checkbox" name="remember"> Ghi nhớ đăng nhập
                    </label>
                    <a href="/auth/forgot-password/forgot-password.html">Quên mật khẩu?</a>
                </div>

                <button type="submit" class="btn btn-primary btn-block" id="submit-btn">
                    Đăng nhập
                </button>
            </form>

            <div class="auth-footer">
                <p>Chưa có tài khoản? <a href="/auth/register/register.html">Đăng ký ngay</a></p>
                <p class="mt-2"><a href="/">← Về trang chủ</a></p>
            </div>
        </div>
    </div>

    <script src="/assets/js/common.js"></script>
    <script src="login.js"></script>
</body>

</html>
