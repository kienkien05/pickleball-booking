<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - Pickleball</title>
    <link rel="stylesheet" href="/assets/css/main.css">
    <link rel="stylesheet" href="register.css">
</head>

<body>
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <div class="auth-logo">🏓</div>
                <h1 class="auth-title">Đăng ký tài khoản</h1>
                <p class="auth-subtitle">Tạo tài khoản để đặt sân Pickleball</p>
            </div>

            <form id="register-form">
                <div class="form-group">
                    <label class="form-label" for="full_name">Họ và tên *</label>
                    <input type="text" id="full_name" name="full_name" class="form-control"
                        placeholder="Nhập họ tên đầy đủ" required>
                    <div class="form-error"></div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="email">Email *</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="example@email.com"
                        required>
                    <div class="form-error"></div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="phone">Số điện thoại</label>
                    <input type="tel" id="phone" name="phone" class="form-control" placeholder="0901234567">
                    <div class="form-error"></div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Mật khẩu *</label>
                    <input type="password" id="password" name="password" class="form-control"
                        placeholder="Tối thiểu 6 ký tự" required>
                    <div class="form-error"></div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="confirm_password">Xác nhận mật khẩu *</label>
                    <input type="password" id="confirm_password" name="confirm_password" class="form-control"
                        placeholder="Nhập lại mật khẩu" required>
                    <div class="form-error"></div>
                </div>

                <button type="submit" class="btn btn-primary btn-block" id="submit-btn">
                    Đăng ký
                </button>
            </form>

            <div class="auth-footer">
                <p>Đã có tài khoản? <a href="/auth/login/login.html">Đăng nhập</a></p>
                <p class="mt-2"><a href="/">← Về trang chủ</a></p>
            </div>
        </div>
    </div>

    <script src="/assets/js/common.js"></script>
    <script src="register.js"></script>
</body>

</html>
