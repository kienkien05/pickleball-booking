<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đánh giá sân - Pickleball</title>
    <link rel="stylesheet" href="/assets/css/main.css">
    <link rel="stylesheet" href="review.css">
</head>

<body>
    <div class="page-wrapper">
        <header class="header">
            <div class="container">
                <a href="/" class="logo">🏓 Pickleball</a>
                <nav class="nav">
                    <a href="/">Trang chủ</a>
                    <a href="/user/search/search.html">Tìm sân</a>
                    <a href="/user/history/history.html">Lịch sử đặt</a>
                </nav>
                <div class="user-nav">
                    <div class="user-menu">
                        <button class="user-menu-btn"><span class="user-name">Người dùng</span> ▼</button>
                        <div class="user-dropdown">
                            <a href="/user/profile/profile.html">Thông tin cá nhân</a>
                            <a href="/user/history/history.html">Lịch sử đặt sân</a>
                            <a href="/user/review/review.html" class="active">Đánh giá</a>
                            <a href="#" class="logout-btn">Đăng xuất</a>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <main class="main-content">
            <div class="container">
                <h1 class="mb-3">Đánh giá sân</h1>

                <!-- Review Form (if booking param exists) -->
                <div id="review-form-container" class="hidden">
                    <div class="card" style="max-width: 600px;">
                        <h2 class="mb-2">Viết đánh giá</h2>
                        <div id="booking-info" class="mb-2"></div>

                        <form id="review-form">
                            <div class="form-group">
                                <label class="form-label">Đánh giá của bạn</label>
                                <div class="star-rating">
                                    <input type="radio" id="star5" name="rating" value="5"><label for="star5">★</label>
                                    <input type="radio" id="star4" name="rating" value="4"><label for="star4">★</label>
                                    <input type="radio" id="star3" name="rating" value="3"><label for="star3">★</label>
                                    <input type="radio" id="star2" name="rating" value="2"><label for="star2">★</label>
                                    <input type="radio" id="star1" name="rating" value="1"><label for="star1">★</label>
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="form-label">Nhận xét (không bắt buộc)</label>
                                <textarea id="comment" name="comment" class="form-control" rows="4"
                                    placeholder="Chia sẻ trải nghiệm của bạn..."></textarea>
                            </div>

                            <div class="flex gap-2">
                                <button type="submit" class="btn btn-primary" id="submit-review-btn">Gửi đánh
                                    giá</button>
                                <a href="/user/history/history.html" class="btn btn-secondary">Quay lại</a>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Reviewable Bookings List -->
                <div id="bookings-list">
                    <div class="loading">
                        <div class="spinner"></div>
                    </div>
                </div>
            </div>
        </main>

        <footer class="footer">
            <div class="container">
                <div class="footer-content">
                    <div>© 2024 Pickleball Court Booking</div>
                </div>
            </div>
        </footer>
    </div>

    <script src="/assets/js/common.js"></script>
    <script src="review.js"></script>
</body>

</html>
